worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    log_format subreq_log '[$time_local] $request_method $uri $status $upstream_status $upstream_addr';
    
    # Upstream ke MinIO (pakai nama service Docker)
    upstream minio_upstream {
        server minio:9000;
    }

    server {
        listen 80;
        log_subrequest on;

        # Mode mapped: JSON file = peta lokasi video
        vod_mode mapped;

        # Nginx ambil JSON dari /json/
        vod_upstream_location /json;

        # Nginx ambil video MP4 dari URL yang ada di dalam JSON
        vod_remote_upstream_location /proxy;

        # Cache agar tidak bolak-balik ke MinIO
        vod_metadata_cache  metadata_cache  512m;
        vod_response_cache  response_cache  128m;
        vod_mapping_cache   mapping_cache   5m;

        # Kompres manifest HLS agar lebih ringan
        gzip on;
        gzip_types application/vnd.apple.mpegurl;

        # -----------------------------------------------
        # INTERNAL: Nginx ambil file JSON dari Storage Dinamis
        # Menangkap format: /json/video/{host}/{bucket}/videos/...
        # -----------------------------------------------
        location ~ ^/json/video/([^/]+)/([^/]+)/(.*)$ {
            internal;
            access_log /var/log/nginx/json.log subreq_log;

            set $storage_host $1;
            set $storage_bucket $2;
            set $file_path $3;

            proxy_pass http://$storage_host/$storage_bucket/$file_path;
            proxy_set_header Host $storage_host;
            resolver 127.0.0.11 ipv6=off;
        }

        # (Opsional) Fallback untuk URL lama: /json/video/videos/...
        location ^~ /json/video/videos/ {
            internal;
            access_log /var/log/nginx/json.log subreq_log;
            proxy_pass http://minio_upstream/public/videos/;
            proxy_set_header Host minio:9000;
        }

        # -----------------------------------------------
        # INTERNAL: Nginx ambil file MP4 dari URL di JSON
        # Format path di JSON: /http/minio:9000/public/video.mp4
        # -----------------------------------------------
        location ~ /proxy/([^/]+)/(.*) {
            internal;
            access_log /var/log/nginx/proxy.log subreq_log;
            proxy_pass $1://$2;
            resolver 127.0.0.11;  # DNS resolver Docker internal
        }

        # -----------------------------------------------
        # RAW FILE ENDPOINT DINAMIS
        # Menangkap format: /raw/{host}/{bucket}/videos/...
        # -----------------------------------------------
        location ~ ^/raw/([^/]+)/([^/]+)/(.*)$ {
            set $storage_host $1;
            set $storage_bucket $2;
            set $file_path $3;

            proxy_pass http://$storage_host/$storage_bucket/$file_path;
            proxy_set_header Host $storage_host;
            resolver 127.0.0.11 ipv6=off;
            
            # CORS headers
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # (Opsional) Fallback untuk URL raw lama
        location ^~ /raw/public/ {
            proxy_pass http://minio_upstream/;
            proxy_set_header Host minio:9000;
            
            # CORS headers
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # -----------------------------------------------
        # ENDPOINT HLS — Frontend request ke sini
        # URL: http://localhost:8080/video/{nama-file.json}/master.m3u8
        # -----------------------------------------------
        location ^~ /video/ {
            vod hls;

            # CORS headers — 'always' agar header disertakan BAHKAN saat error (502, 404, dll)
            # Ini penting agar browser tidak salah membaca error sebagai CORS error
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Expose-Headers 'Server,range,Content-Length,Content-Range' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Origin '*' always;

            # Handle OPTIONS preflight request
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin '*';
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
                add_header Access-Control-Allow-Headers '*';
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            expires 100d;
        }
    }
}
